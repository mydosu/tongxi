<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- 底板：近白到冰蓝，像阿尔比恩的发色那样清透，不再是浓紫渐变 -->
    <linearGradient id="tile" x1="20" y1="10" x2="236" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdfcff"/>
      <stop offset=".6" stop-color="#f1effb"/>
      <stop offset="1" stop-color="#e3eefa"/>
    </linearGradient>
    <linearGradient id="lilac" x1="42" y1="66" x2="166" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b3a8e2"/>
      <stop offset="1" stop-color="#9688d0"/>
    </linearGradient>
    <linearGradient id="ice" x1="90" y1="66" x2="214" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cc3e8"/>
      <stop offset="1" stop-color="#7eaadb"/>
    </linearGradient>
    <!-- 交织：每只菱形在一个交点被切开一道，让另一只从上面压过去 -->
    <mask id="cut-top" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <path d="M108 70 148 110" stroke="#000" stroke-width="34"/>
    </mask>
    <mask id="cut-bottom" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <path d="M108 146 148 186" stroke="#000" stroke-width="34"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#tile)"/>
  <!-- 一道淡紫描边：浅色任务栏上也认得出边界 -->
  <rect x="10" y="10" width="236" height="236" rx="60" fill="none" stroke="#cfc8ec" stroke-width="4"/>
  <!-- 方胜：两个菱形相套、一上一下交织，取「同心」 -->
  <g fill="none" stroke-width="21" stroke-linejoin="round" stroke-linecap="round">
    <path d="M90 128 152 66 214 128 152 190Z" stroke="url(#ice)" mask="url(#cut-top)"/>
    <path d="M42 128 104 66 166 128 104 190Z" stroke="url(#lilac)" mask="url(#cut-bottom)"/>
  </g>
</svg>
