[package]
name = "tongxi-mobile"
version = "0.1.0"
description = "同席手机薄壳：扫码配对后整页打开桌面同席的网关地址"
authors = ["同席"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tongxi_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-barcode-scanner = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 薄壳自己没有一行 Rust 业务代码，debug 版带着 tauri/wry 的调试符号有 110 MB+，
# 打进 APK 就是 129 MB（gradle 那边 keepDebugSymbols 还会拦住 AGP 的 strip）。
# 编译时就把 debuginfo 去掉：本机 .so 直接降到 10 MB 上下，APK 跟着小两个数量级，
# 真要调 Rust 侧就临时把这行注释掉。
[profile.dev]
strip = "debuginfo"
