<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-label="项目协作流程图：你说一句话、主脑想清楚，两位成员并行在做、一步等你拍板，之后主脑把关、合并收尾，下一件事接着任务书和计划做">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f2fc"/>
      <stop offset=".5" stop-color="#eff5fc"/>
      <stop offset="1" stop-color="#eef8f2"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7f74b4" fill-opacity=".22"/></pattern>
    <filter id="card" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#606aa0" flood-opacity=".12"/>
    </filter>
    <!-- 卡片底色：状态色淡淡地从左上角洇开 -->
    <linearGradient id="t-done" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#f1f0f7"/><stop offset=".58" stop-color="#fff" stop-opacity=".7"/></linearGradient>
    <linearGradient id="t-doing" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#e6f2ec"/><stop offset=".58" stop-color="#fff" stop-opacity=".94"/></linearGradient>
    <linearGradient id="t-you" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#f7f0e3"/><stop offset=".58" stop-color="#fff" stop-opacity=".94"/></linearGradient>
    <linearGradient id="t-todo" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#f0f1f6"/><stop offset=".58" stop-color="#fff" stop-opacity=".94"/></linearGradient>
    <!-- 在做的那几步：一圈流光沿边框转 -->
    <linearGradient id="spin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9384e2" stop-opacity="0"/>
      <stop offset=".3" stop-color="#9384e2"/>
      <stop offset=".5" stop-color="#6fa7e6"/>
      <stop offset=".72" stop-color="#7fc4a0"/>
      <stop offset="1" stop-color="#7fc4a0" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#b9bcd2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-lilac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#a598d8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#4a9f7b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif; }
      .h { font-size: 24px; font-weight: 700; fill: #394057; }
      .s { font-size: 15px; fill: #8a90b0; }
      .k { font-size: 13px; fill: #7a809e; }
      .t { font-size: 16px; font-weight: 700; fill: #394057; }
      .t.done { fill: #7a809e; }
      .f { font-size: 13px; fill: #8a90b0; }
      .e { fill: none; stroke-width: 1.8; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <text class="h" x="40" y="58">项目协作，一句话交给主脑</text>
  <text class="s" x="40" y="88">主脑把活拆成几步、派给成员并行做。派活页上就是这样一张图：在做的描着流光，等你的轻轻呼吸，指到一步亮出它的整条链。</text>

  <!-- 图例：卡片颜色就是状态 -->
  <g class="k">
    <circle cx="904" cy="54" r="4" fill="#4a9f7b"/><text x="914" y="59">在做</text>
    <circle cx="970" cy="54" r="4" fill="#6c86b6"/><text x="980" y="59">待审</text>
    <circle cx="1036" cy="54" r="4" fill="#b5873a"/><text x="1046" y="59">等你</text>
    <circle cx="1102" cy="54" r="4" fill="#9ea3bd"/><text x="1112" y="59">没做</text>
    <circle cx="1168" cy="54" r="4" fill="#7f74b4"/><text x="1178" y="59">做完</text>
  </g>

  <!-- 点阵画布 -->
  <rect x="24" y="112" width="1232" height="364" rx="20" fill="#f7f6fd" fill-opacity=".55" stroke="#fff" stroke-opacity=".85"/>
  <rect x="24" y="112" width="1232" height="364" rx="20" fill="url(#dots)"/>

  <!-- 连线：上游做完了是淡紫，通向在做那一步的流动，其余灰 -->
  <path class="e" d="M252 280H297" stroke="#a598d8" marker-end="url(#a-lilac)"/>
  <path class="e" d="M496 280C520 280 518 184 541 184" stroke="#4a9f7b" stroke-dasharray="5 7" marker-end="url(#a-ok)"><animate attributeName="stroke-dashoffset" values="0;-12" dur="1.1s" repeatCount="indefinite"/></path>
  <path class="e" d="M496 280H541" stroke="#4a9f7b" stroke-dasharray="5 7" marker-end="url(#a-ok)"><animate attributeName="stroke-dashoffset" values="0;-12" dur="1.1s" repeatCount="indefinite"/></path>
  <path class="e" d="M496 280C520 280 518 376 541 376" stroke="#a598d8" marker-end="url(#a-lilac)"/>
  <path class="e" d="M740 184C764 184 762 280 785 280" stroke="#c9cbe0" marker-end="url(#a-gray)"/>
  <path class="e" d="M740 280H785" stroke="#c9cbe0" marker-end="url(#a-gray)"/>
  <path class="e" d="M740 376C764 376 762 280 785 280" stroke="#c9cbe0" marker-end="url(#a-gray)"/>
  <path class="e" d="M984 280H1029" stroke="#c9cbe0" marker-end="url(#a-gray)"/>

  <!-- 下一件事：回到开头 -->
  <path d="M1130 324V446H154V328" fill="none" stroke="#a598d8" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8" marker-end="url(#a-lilac)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
  <rect x="490" y="432" width="300" height="28" rx="14" fill="#fff" fill-opacity=".92"/>
  <text class="k" x="640" y="451" text-anchor="middle">下一件事 · 接着任务书和计划做</text>

  <!-- 做完 -->
  <g transform="translate(56 240)">
    <rect width="196" height="80" rx="14" fill="url(#t-done)" stroke="#fff" stroke-opacity=".8"/>
    <circle cx="26" cy="28" r="9.5" fill="#e9e7f2"/><path d="M22 28.2 25 31 30.5 25" fill="none" stroke="#7f74b4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t done" x="44" y="34">你说一句话</text>
    <text class="f" x="18" y="62">在群里或主脑会话里说</text>
  </g>
  <g transform="translate(300 240)">
    <rect width="196" height="80" rx="14" fill="url(#t-done)" stroke="#fff" stroke-opacity=".8"/>
    <circle cx="26" cy="28" r="9.5" fill="#e9e7f2"/><path d="M22 28.2 25 31 30.5 25" fill="none" stroke="#7f74b4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t done" x="44" y="34">主脑想清楚</text>
    <text class="f" x="18" y="62">写任务书，拆成几步</text>
  </g>

  <!-- 在做：两位成员并行 -->
  <g transform="translate(544 144)">
    <rect width="196" height="80" rx="14" fill="url(#t-doing)" stroke="#fff" filter="url(#card)"/>
    <rect x="-1" y="-1" width="198" height="82" rx="15" fill="none" stroke="url(#spin)" stroke-width="2.2"/>
    <circle cx="26" cy="28" r="9.5" fill="#e0efe9"/><circle cx="26" cy="28" r="3.4" fill="#4a9f7b"/>
    <text class="t" x="44" y="34">改接口</text>
    <text class="f" x="18" y="62">Codex · 工作树 · 12 分钟</text>
  </g>
  <g transform="translate(544 240)">
    <rect width="196" height="80" rx="14" fill="url(#t-doing)" stroke="#fff" filter="url(#card)"/>
    <rect x="-1" y="-1" width="198" height="82" rx="15" fill="none" stroke="url(#spin)" stroke-width="2.2"/>
    <circle cx="26" cy="28" r="9.5" fill="#e0efe9"/><circle cx="26" cy="28" r="3.4" fill="#4a9f7b"/>
    <text class="t" x="44" y="34">补测试</text>
    <text class="f" x="18" y="62">克大姐 · 工作树 · 8 分钟</text>
  </g>

  <!-- 等你：轻轻呼吸 -->
  <g transform="translate(544 336)">
    <rect width="196" height="80" rx="14" fill="none" stroke="#b5873a" stroke-width="10" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;.15;0" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect width="196" height="80" rx="14" fill="url(#t-you)" stroke="#fff" filter="url(#card)"/>
    <circle cx="26" cy="28" r="9.5" fill="#f2ebdd"/><rect x="22.6" y="24.4" width="2.2" height="7.2" rx="1" fill="#b5873a"/><rect x="27.2" y="24.4" width="2.2" height="7.2" rx="1" fill="#b5873a"/>
    <text class="t" x="44" y="34">等你拍板</text>
    <text class="f" x="18" y="62">在问答面板回答就行</text>
  </g>

  <!-- 没做 -->
  <g transform="translate(788 240)">
    <rect width="196" height="80" rx="14" fill="url(#t-todo)" stroke="#fff" filter="url(#card)"/>
    <circle cx="26" cy="28" r="9.5" fill="#ecedf3"/><circle cx="26" cy="28" r="3.6" fill="none" stroke="#8a90b0" stroke-width="1.5"/>
    <text class="t" x="44" y="34">主脑把关</text>
    <text class="f" x="18" y="62">看交回的结果</text>
    <rect x="124" y="49" width="60" height="20" rx="10" fill="#b0634f" fill-opacity=".1"/>
    <text x="154" y="63" text-anchor="middle" font-size="12" fill="#b0634f">拖住 1 件</text>
  </g>
  <g transform="translate(1032 240)">
    <rect width="196" height="80" rx="14" fill="url(#t-todo)" stroke="#fff" filter="url(#card)"/>
    <circle cx="26" cy="28" r="9.5" fill="#ecedf3"/><circle cx="26" cy="28" r="3.6" fill="none" stroke="#8a90b0" stroke-width="1.5"/>
    <text class="t" x="44" y="34">合并收尾</text>
    <text class="f" x="18" y="62">结论写进计划.md</text>
  </g>
</svg>
